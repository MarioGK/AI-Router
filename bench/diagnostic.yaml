  - name: vision/trace-across-services
    group: capability
    expect: [claude-opus-5-5]
    reasoning: [xhigh]
    images: true
    note: Vision eligibility does not reduce an unknown multi-service failure to a routine task.
    prompt: >-
      The attached trace screenshots show intermittent writes disappearing
      across the gateway, coordinator and storage replicas. No one knows
      whether the traces indicate a commit bug or misleading instrumentation.
      Investigate the full protocol, prove the failure mechanism and fix it.

  - name: offered/tiny-without-flash
    group: offered-fallback
    expect: [glm-5.3]
    reasoning: [low]
    offered: [glm-5.3, gpt-6.1-sol, claude-opus-5-5]
    note: With Flash unavailable, GLM is the nearest offered model above the tiny-edit tier.
    prompt: In config/sandbox.ini, change the single literal max_attempts = 2 to max_attempts = 3.

  - name: offered/routine-without-glm
    group: offered-fallback
    expect: [gpt-6.1-sol]
    reasoning: [medium]
    offered: [deepseek-flash, gpt-6.1-sol, claude-opus-5-5]
    note: Flash is too small for a routine feature; absent GLM, choose Sol before Opus.
    prompt: >-
      Add a saved-search name field to the existing dialog and persist it
      through the existing endpoint. Include required-field validation and
