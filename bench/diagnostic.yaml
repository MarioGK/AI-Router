  - name: offered/priority-only-cheaper
    group: offered-fallback
    expect: [glm-5.3]
    reasoning: [medium]
    offered: [deepseek-flash, glm-5.3]
    note: Sol is required by priority but unavailable; GLM is the strongest offered option.
    prompt: >-
      Add owner filtering to the existing workspace endpoint and its tests
