  - name: offered/ui-only-flash
    group: offered-fallback
    expect: [deepseek-flash]
    reasoning: [high]
    offered: [deepseek-flash]
    note: With only one model offered, it is the strongest fallback even for substantial UI.
    prompt: >-
      Build a new responsive campaign-management page with a calendar,
