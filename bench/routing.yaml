  # Slightly harder, bounded backend work; urgency is not required for this tier.
  - name: harder/cursor-pagination
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      Bidirectional cursor predicates and concurrent inserts require tricky reasoning
      within a settled API scope.
    prompt: >-
      Replace offset pagination in the Rust audit API with bidirectional keyset
      pagination over (created_at, id). Work out predicates for both directions,
      sign and validate cursors using our existing helper, and test equal
      timestamps and inserts between page fetches. Keep the current filters
      and schema; no UI or cross-service protocol changes. No rush.
  - name: harder/nested-filter-parser
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      A settled grammar still requires a nontrivial parser and precise nested-expression
      diagnostics.
    prompt: >-
      Extend the C# backend filter parser to support nested AND/OR groups,
      quoted strings with escapes and NOT with the precedence in docs/filters.md.
      The flat token splitter cannot handle nesting. Implement a parser with
      source-position errors and tests for malformed nested expressions; keep
      the existing evaluator. This is planned work, with the grammar settled.
  - name: harder/stream-cancellation
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      The reproduced stuck send bounds the investigation, but error and closure races
      need careful coordination.
    prompt: |-
      In internal/export/stream.go, cancellation can leave the producer blocked
      on sending a row while the HTTP handler exits. We have a deterministic
      reproduction in stream_cancel_test.go and know which send is stuck.

      Rework coordination of the producer, encoder and handler so cancellation
      closes the database iterator, preserves the first error and cannot race
      with channel closure. Test disconnects during reads, sends and final flush.
      Keep this within the export package; no service-wide redesign or deadline.
  - name: harder/cache-dependency-invalidation
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      Interleaved mutations require subtle dependency reasoning inside one request-local
      cache.
    prompt: >-
      Our TypeScript backend caches permission lookups inside each request.
      After a group membership changes within a batch, later operations reuse
      a stale result. Follow the known dependency chain from member to group
      to effective permissions, fix invalidation in the request-local cache,
      and test interleaved mutations and reads. No distributed cache, token
      changes or unknown isolation failure is involved. Planned maintenance.
  - name: harder/report-query-plan
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      The isolated bottleneck requires comparing query plans while preserving ties and
      missing-row semantics.
    prompt: >-
      Tune the monthly report query in db/reports.sql. EXPLAIN shows its
      correlated latest-status subquery scans order_events once per order.
      Compare a window query and lateral join with an index, preserving ties
      and missing statuses. Implement the best option with fixtures and a
      representative benchmark. The bottleneck is isolated to this query;
      we can schedule the additive index normally.
  - name: harder/orm-transaction-semantics
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      Savepoints and exception translation require semantic reconciliation in four known
      repository methods.
    prompt: >-
      Replace the legacy ORM in the Python returns module with SQLAlchemy.
      Only four repository methods are involved, but nested savepoints and
      exception translation differ: reconcile these against our documented
      transaction contract and preserve rollback behavior with integration
      tests. Other modules stay on the old ORM; no live data migration or
      deadline. A search-and-replace will not preserve these semantics.
  - name: harder/archive-path-containment
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      A localized archive threat model needs careful containment rules and crafted
      security tests.
    prompt: >-
      Harden the Go archive importer against path traversal for the documented
      threat model: untrusted tar entries, a fresh private extraction directory
      and no concurrent filesystem writers. Work through normalized names,
      reject symlink and hardlink entries, enforce containment and test crafted
      archives. The gap is localized to pkg/archive; no broader security
      investigation is requested. This is scheduled hardening.
  - name: harder/pt-resumable-import
    group: bounded
    expect: [gpt-6.1-sol]
    reasoning: [high]
    note: >-
      The transaction design is settled, but quoted multiline records and crash
      boundaries make offsets tricky.
    prompt: >-
      Adicione retomada ao importador Python de CSV de 20 GB. O desenho já está
      decidido: cada lote e seu checkpoint vão na mesma transação Postgres,
      a chave de negócio elimina duplicatas e um hash identifica o arquivo.
      Implemente offsets seguros inclusive com campos entre aspas contendo
      quebras de linha e teste falha antes e depois do commit. Há um único
      processo; não precisamos de coordenação distribuída. Sem pressa.

