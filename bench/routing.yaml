  # Opus: the most complex work, regardless of urgency, file count or UI callers.
  - name: complex/multi-region-design
    group: difficult
    expect: [claude-opus-5-5]
    reasoning: [xhigh]
    note: >-
      Consistency, fencing, partitions and migration decisions form an interdependent
      distributed-system design.
    prompt: |-
      Plan and implement multi-region failover for the storage service in this
      repo. Start with internal/replication and deploy/terraform; we currently
      assume a single writer in one region.

      Work out consistency, writer fencing, recovery after a network partition
      and how to migrate existing clusters without losing acknowledged writes.
      Include failure tests and a staged rollout. This is next quarter's work,
      so latency of the implementation process isn't a concern.
  - name: complex/scheduler-race
    group: difficult
    expect: [claude-opus-5-5]
    reasoning: [xhigh]
    note: >-
      An unreproduced ownership failure across nodes and commit paths requires open-
      ended protocol investigation.
    prompt: >-
      Our Go scheduler rarely executes a job twice across nodes when lease
      renewal, network partitions and worker shutdown overlap. We have no
      reliable reproduction. Trace the scheduler, lease store and commit path,
      determine which ownership invariant fails, and redesign the protocol
      if necessary with deterministic failure tests. This is planned work.
  - name: complex/auth-security-review
    group: difficult
    expect: [claude-opus-5-5]
    reasoning: [xhigh]
    note: >-
      Unknown isolation failures across authentication, workers and database roles
      require deep trust-boundary analysis.
    prompt: |-
      Review the security of our multi-tenant authentication and session system
      across api/auth, workers/tokens and the database roles. We suspect that
      token refresh, impersonation and tenant switching interact incorrectly,
      but don't yet have a reproduction. This is a planned review.

      Trace trust boundaries, build exploit regression tests, fix any isolation
      failures and plan a compatible token migration. Scope is server-side only.
  - name: complex/urgent-cross-service-incident
    group: difficult
