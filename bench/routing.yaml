    expect: [deepseek-flash]
    reasoning: [low]
    note: >-
      The urgency does not change a known literal replacement in one configuration file.
    prompt: 'Urgent, our smoke test is blocked: change port 8080 to 9090 in configs/test.yaml; the server already uses 9090.'
  - name: tiny/api-field-for-frontend
