# Labelled routing cases for `ai-router bench`. Policy (operator, 2026-09-29):
#   quick, straightforward prompts and tiny explicit edits -> deepseek-flash
#   simple-to-medium backend/frontend work that can wait -> glm-5.3
#   higher priority or trickier bounded work -> gpt-6.1-sol (high effort)
#   high difficulty and substantial UI changes -> claude-opus-5-5
# Difficulty ladder: deepseek-flash, glm-5.3, gpt-6.1-sol, claude-opus-5-5.
# Sonnet 5.5 is retired in favor of Sol. Urgency alone does not justify Opus;
# difficult tasks and substantial UI changes stay on Opus even when urgent.
# Prompt length and file count alone do not raise difficulty: mechanical
# bulk work with clear rules stays on GLM when it can wait, or Sol when
# higher priority. Routine UI components follow the same rule. Opus handles
# difficult architecture, distributed/security/durability problems,
# investigations across services, whole new pages and major UI redesigns.
# Reasoning levels (operator, 2026-09-29) follow the depth of thinking, not
# the model or urgency: tiny and mechanical edits, however large -> low;
# everyday work with a clear path -> medium; bounded but tricky problems ->
# high; open-ended design and unknown causes -> xhigh.
# 72 cases; `expect` lists the acceptable models, usually one, and
# `reasoning` the acceptable levels.
# Groups describe routing boundaries rather than source paths; notes explain
# the labels for reviewers without becoming part of the prompt.
cases:
  # Really small: explicit local fixes, including urgent and security changes.
  - name: tiny/rename-local
    group: quick
    expect: [deepseek-flash]
    reasoning: [low]
    note: >-
      The named local variable and containing function make this an explicit mechanical
      edit.
    prompt: Rename the local variable cnt to count inside countRows in internal/report.go.
  - name: tiny/pt-readme-typo
    group: quick
    expect: [deepseek-flash]
    reasoning: [low]
    note: >-
      The exact Portuguese typo and replacement are supplied in a named document
      section.
    prompt: Corrija só o erro de digitação "instalção" para "instalação" na seção de setup do README.md.
  - name: tiny/doc-comment
    group: quick
    expect: [deepseek-flash]
    reasoning: [low]
    note: >-
      The target function and comment content are supplied without an API or behavior
      change.
    prompt: Add a doc comment to ParseDate in dates.go saying it accepts YYYY-MM-DD and returns UTC midnight or an error.
  - name: tiny/urgent-config-port
